<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080d">
<title>Wee Routine — History</title>

<style>
:root{
--bg:#07080d;--card:#10121a;--line:rgba(255,255,255,.08);
--text:#f5f7fb;--muted:#8e95a5;--accent:#8065ff;
--green:#35d58a;--red:#ff5f7d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
background:radial-gradient(circle at 20% 0%,rgba(128,101,255,.15),transparent 30%),var(--bg);
color:var(--text);
font-family:Inter,system-ui,sans-serif;
min-height:100vh;
}
.app{max-width:560px;margin:auto;padding:22px 16px 100px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.back{width:40px;height:40px;border:1px solid var(--line);background:#10121a;color:white;border-radius:13px}
h1{font-size:21px}.sub{font-size:10px;color:var(--muted);margin-top:3px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px}
.card{background:#10121a;border:1px solid var(--line);border-radius:20px;padding:18px}
.card strong{font-size:27px;display:block}.card span{font-size:10px;color:var(--muted)}
.history{display:flex;flex-direction:column;gap:9px}
.item{padding:15px;border:1px solid var(--line);background:#10121a;border-radius:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.left{display:flex;align-items:center;gap:12px;min-width:0}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800}
.done{background:rgba(53,213,138,.1);color:var(--green)}
.rejected{background:rgba(255,95,125,.1);color:var(--red)}
.name{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{font-size:9px;color:var(--muted);margin-top:4px}
.result{font-size:10px;font-weight:700}
.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;font-size:12px}
.bottom{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(510px,calc(100% - 30px));height:66px;border:1px solid var(--line);border-radius:22px;background:rgba(15,16,23,.9);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center}
.nav{text-align:center;color:var(--muted);font-size:17px;text-decoration:none}.nav span{display:block;font-size:9px;margin-top:4px}.active{color:#a893ff}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <button class="back" onclick="location.href='index.html'">←</button>
    <div>
        <h1>History</h1>
        <div class="sub">Your routine activity</div>
    </div>
</div>

<div class="summary">

    <div class="card">
        <strong id="completed">0</strong>
        <span>Completed</span>
    </div>

    <div class="card">
        <strong id="rejected">0</strong>
        <span>Rejected</span>
    </div>

</div>

<div class="history" id="history"></div>

</div>

<nav class="bottom">
<a class="nav" href="index.html">W<span>Home</span></a>
<a class="nav active" href="history.html">H<span>History</span></a>
<a class="nav" href="statistics.html">S<span>Stats</span></a>
<a class="nav" href="profile.html">P<span>Profile</span></a>
<a class="nav" href="settings.html">A<span>Settings</span></a>
</nav>

<script>
const KEY="weeRoutineData";

function load(){
    try{
        return JSON.parse(localStorage.getItem(KEY))||{
            points:0,routines:[],history:[]
        };
    }catch(e){
        return {points:0,routines:[],history:[]};
    }
}

function escapeHTML(v){
    return String(v)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

const data=load();

const completed=data.history.filter(
    x=>x.result==="completed"
).length;

const rejected=data.history.filter(
    x=>x.result==="rejected"
).length;

document.getElementById("completed").textContent=completed;
document.getElementById("rejected").textContent=rejected;

const box=document.getElementById("history");

if(!data.history.length){

    box.innerHTML=`
        <div class="empty">
            Your routine history is empty.
        </div>
    `;

}else{

    data.history.forEach(item=>{

        const d=new Date(item.date);

        const div=document.createElement("div");

        div.className="item";

        const isDone=item.result==="completed";

        div.innerHTML=`

        <div class="left">

            <div class="dot ${isDone?"done":"rejected"}">
                ${isDone?"✓":"×"}
            </div>

            <div>
                <div class="name">
                    ${escapeHTML(item.name)}
                </div>

                <div class="date">
                    ${d.toLocaleDateString("en-IN")}
                    ·
                    ${d.toLocaleTimeString("en-IN",{
                        hour:"2-digit",
                        minute:"2-digit"
                    })}
                </div>
            </div>

        </div>

        <div class="result ${isDone?"done":"rejected"}">
            ${isDone?"+10":"Rejected"}
        </div>

        `;

        box.appendChild(div);
    });
}
</script>

</body>
</html>
