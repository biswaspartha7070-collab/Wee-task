<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080d">
<title>Wee Routine — Statistics</title>

<style>
:root{
--bg:#07080d;--card:#10121a;--line:rgba(255,255,255,.08);
--text:#f5f7fb;--muted:#8e95a5;--accent:#8065ff;
--green:#35d58a;--red:#ff5f7d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 15% 0%,rgba(128,101,255,.15),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
.app{max-width:560px;margin:auto;padding:22px 16px 105px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.back{width:40px;height:40px;border:1px solid var(--line);background:#10121a;color:white;border-radius:13px}
h1{font-size:21px}.sub{font-size:10px;color:var(--muted);margin-top:3px}
.hero{padding:22px;border-radius:23px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(128,101,255,.14),rgba(255,255,255,.02));margin-bottom:12px}
.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.3px}
.score{font-size:42px;font-weight:850;margin-top:4px}
.progress{height:8px;background:rgba(255,255,255,.07);border-radius:20px;overflow:hidden;margin-top:18px}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ad9cff)}
.percent{text-align:right;color:var(--muted);font-size:10px;margin-top:7px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.card{padding:18px;border-radius:19px;border:1px solid var(--line);background:var(--card)}
.card strong{font-size:26px;display:block}.card span{font-size:10px;color:var(--muted)}
.week{margin-top:12px;padding:18px;border:1px solid var(--line);background:var(--card);border-radius:20px}
.week h2{font-size:15px;margin-bottom:17px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px}
.day{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.column{width:100%;height:105px;border-radius:8px;background:rgba(255,255,255,.045);display:flex;align-items:flex-end;overflow:hidden}
.fill{width:100%;height:0;background:linear-gradient(to top,var(--accent),#aa98ff);border-radius:8px 8px 0 0}
.day small{font-size:9px;color:var(--muted)}
.empty{padding:25px;text-align:center;color:var(--muted);font-size:11px}
.bottom{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(510px,calc(100% - 30px));height:66px;border:1px solid var(--line);border-radius:22px;background:rgba(15,16,23,.9);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center}
.nav{text-align:center;color:var(--muted);font-size:17px;text-decoration:none}.nav span{display:block;font-size:9px;margin-top:4px}.active{color:#a893ff}
</style>
</head>

<body>

<div class="app">

<div class="header">
<button class="back" onclick="location.href='index.html'">←</button>
<div>
<h1>Statistics</h1>
<div class="sub">Performance overview</div>
</div>
</div>

<section class="hero">

<div class="label">Total points</div>
<div class="score" id="points">0</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="percent" id="percent">0% completion</div>

</section>

<div class="grid">

<div class="card">
<strong id="completed">0</strong>
<span>Total completed</span>
</div>

<div class="card">
<strong id="rejected">0</strong>
<span>Total rejected</span>
</div>

<div class="card">
<strong id="routines">0</strong>
<span>Total routines</span>
</div>

<div class="card">
<strong id="pending">0</strong>
<span>Currently pending</span>
</div>

</div>

<section class="week">

<h2>Last 7 days</h2>

<div class="days" id="days"></div>

</section>

</div>

<nav class="bottom">
<a class="nav" href="index.html">W<span>Home</span></a>
<a class="nav" href="history.html">H<span>History</span></a>
<a class="nav active" href="statistics.html">S<span>Stats</span></a>
<a class="nav" href="profile.html">P<span>Profile</span></a>
<a class="nav" href="settings.html">A<span>Settings</span></a>
</nav>

<script>
const KEY="weeRoutineData";

function getData(){
try{
return JSON.parse(localStorage.getItem(KEY))||{
points:0,routines:[],history:[]
};
}catch(e){
return {points:0,routines:[],history:[]};
}
}

const data=getData();

const completed=data.history.filter(
x=>x.result==="completed"
).length;

const rejected=data.history.filter(
x=>x.result==="rejected"
).length;

const pending=data.routines.filter(
x=>x.status==="pending"
).length;

const total=completed+rejected;

const rate=total?Math.round(completed/total*100):0;

document.getElementById("points").textContent=data.points;
document.getElementById("completed").textContent=completed;
document.getElementById("rejected").textContent=rejected;
document.getElementById("routines").textContent=data.routines.length;
document.getElementById("pending").textContent=pending;
document.getElementById("bar").style.width=rate+"%";
document.getElementById("percent").textContent=rate+"% completion";

const daysBox=document.getElementById("days");

for(let i=6;i>=0;i--){

const date=new Date();
date.setHours(0,0,0,0);
date.setDate(date.getDate()-i);

const next=new Date(date);
next.setDate(next.getDate()+1);

const count=data.history.filter(x=>{
if(x.result!=="completed")return false;
const d=new Date(x.date);
return d>=date && d<next;
}).length;

const div=document.createElement("div");
div.className="day";

div.innerHTML=`
<div class="column">
<div class="fill" style="height:${Math.min(count*30,100)}%"></div>
</div>
<small>
${date.toLocaleDateString("en-IN",{weekday:"short"}).slice(0,2)}
</small>
`;

daysBox.appendChild(div);
}
</script>

</body>
</html>
