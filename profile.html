<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080d">
<title>Wee Routine — Profile</title>

<style>
:root{
--bg:#07080d;--card:#10121a;--line:rgba(255,255,255,.08);
--text:#f5f7fb;--muted:#8e95a5;--accent:#8065ff;--green:#35d58a
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(circle at 15% 0%,rgba(128,101,255,.15),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
.app{max-width:560px;margin:auto;padding:22px 16px 105px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:25px}
.back{width:40px;height:40px;border:1px solid var(--line);background:#10121a;color:white;border-radius:13px}
h1{font-size:21px}.sub{font-size:10px;color:var(--muted);margin-top:3px}
.profile{padding:25px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(135deg,rgba(128,101,255,.14),rgba(255,255,255,.02));text-align:center}
.avatar{width:72px;height:72px;margin:auto;border-radius:23px;background:linear-gradient(135deg,var(--accent),#4d3bc2);display:grid;place-items:center;font-size:25px;font-weight:900}
.profile h2{font-size:20px;margin-top:14px}.profile p{font-size:10px;color:var(--muted);margin-top:4px}
.points{font-size:31px;font-weight:850;margin-top:17px}.points span{font-size:10px;color:#a893ff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:18px}
.card strong{display:block;font-size:24px}.card span{font-size:10px;color:var(--muted)}
.info{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:19px}
.info h3{font-size:14px;margin-bottom:15px}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px}
.row:last-child{border-bottom:0}.row span{color:var(--muted)}
.bottom{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(510px,calc(100% - 30px));height:66px;border:1px solid var(--line);border-radius:22px;background:rgba(15,16,23,.9);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center}
.nav{text-align:center;color:var(--muted);font-size:17px;text-decoration:none}.nav span{display:block;font-size:9px;margin-top:4px}.active{color:#a893ff}
</style>
</head>

<body>

<div class="app">

<div class="header">
<button class="back" onclick="location.href='index.html'">←</button>
<div>
<h1>Profile</h1>
<div class="sub">Your routine identity</div>
</div>
</div>

<section class="profile">

<div class="avatar">W</div>

<h2>Routine User</h2>
<p>Building better days, one routine at a time.</p>

<div class="points">
<span id="points">0</span>
<small> POINTS</small>
</div>

</section>

<div class="grid">

<div class="card">
<strong id="completed">0</strong>
<span>Completed</span>
</div>

<div class="card">
<strong id="routines">0</strong>
<span>Total routines</span>
</div>

<div class="card">
<strong id="rejected">0</strong>
<span>Rejected</span>
</div>

<div class="card">
<strong id="rate">0%</strong>
<span>Success rate</span>
</div>

</div>

<div class="info">

<h3>Routine overview</h3>

<div class="row">
<span>Current status</span>
<strong id="status">Active</strong>
</div>

<div class="row">
<span>Pending routines</span>
<strong id="pending">0</strong>
</div>

<div class="row">
<span>Points per completion</span>
<strong>+10</strong>
</div>

</div>

</div>

<nav class="bottom">
<a class="nav" href="index.html">W<span>Home</span></a>
<a class="nav" href="history.html">H<span>History</span></a>
<a class="nav" href="statistics.html">S<span>Stats</span></a>
<a class="nav active" href="profile.html">P<span>Profile</span></a>
<a class="nav" href="settings.html">A<span>Settings</span></a>
</nav>

<script>
const KEY="weeRoutineData";

function data(){
try{
return JSON.parse(localStorage.getItem(KEY))||{
points:0,routines:[],history:[]
};
}catch(e){
return {points:0,routines:[],history:[]};
}
}

const d=data();

const completed=d.history.filter(
x=>x.result==="completed"
).length;

const rejected=d.history.filter(
x=>x.result==="rejected"
).length;

const total=completed+rejected;

const rate=total?
Math.round(completed/total*100):0;

const pending=d.routines.filter(
x=>x.status==="pending"
).length;

document.getElementById("points").textContent=d.points;
document.getElementById("completed").textContent=completed;
document.getElementById("rejected").textContent=rejected;
document.getElementById("routines").textContent=d.routines.length;
document.getElementById("rate").textContent=rate+"%";
document.getElementById("pending").textContent=pending;
</script>

</body>
</html>
